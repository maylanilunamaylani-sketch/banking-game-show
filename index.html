<!DOCTYPE html>
<html lang="id">
<head>
<meta name="google-site-verification" content="cz2F1T1iTtj-8x0mdrgzXqJfzwqHVs9gNxikVi0rK5U" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE BANKING GAME SHOW</title>
<style>
/* =====================================================================
   THE BANKING GAME SHOW — styles.css
   Tema: navy, ungu, kuning neon, cyan. Dioptimalkan untuk TV / proyektor.
   Semua ukuran memakai rem agar ikut membesar di layar besar.
   ===================================================================== */
:root{
  --navy:#070b24; --mid:#0f1650; --purple:#2b0f63; --violet:#8a4bff;
  --yellow:#ffe033; --cyan:#27e1ff; --green:#2ee27d; --red:#ff4d6a;
  --glass:rgba(255,255,255,.08); --line:rgba(255,255,255,.2);
  --c1:#8a4bff; --c2:#27e1ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(13px,min(1.15vw,2vh),30px)}
body{
  font-family:'Poppins','Segoe UI','Trebuchet MS',system-ui,-apple-system,sans-serif;
  color:#fff;height:100vh;height:100dvh;overflow:hidden;
  background:
    radial-gradient(ellipse at 15% 0%,#3b1a8f 0,transparent 55%),
    radial-gradient(ellipse at 95% 100%,#0a4f8a 0,transparent 50%),
    linear-gradient(160deg,#070b24,#0d1245 50%,#1b0b3f);
}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:.2rem solid var(--yellow);outline-offset:.15rem}

/* ---------- Latar dekoratif ---------- */
#bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bgfx::before{
  content:'';position:absolute;left:50%;top:-60%;width:160vmax;height:160vmax;margin-left:-80vmax;
  background:conic-gradient(from 0deg,transparent 0 8%,rgba(138,75,255,.14) 10%,transparent 14% 50%,rgba(39,225,255,.1) 52%,transparent 56%);
  animation:spin 40s linear infinite;
}
#bgfx span{position:absolute;font-size:2.4rem;opacity:.12;animation:floaty linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-20vh) rotate(360deg)}}

#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh}
#app.shake{animation:shake .55s}
@keyframes shake{10%,90%{transform:translate(-3px,0)}20%,80%{transform:translate(5px,2px)}30%,50%,70%{transform:translate(-8px,-2px)}40%,60%{transform:translate(8px,3px)}}

/* ---------- Topbar ---------- */
#topbar{display:flex;align-items:center;gap:.6rem;padding:.55rem 1.1rem;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(5,8,30,.85),rgba(5,8,30,.35));border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.top-spacer{flex:1}
.brand{display:flex;align-items:center;gap:.6rem;background:none;text-align:left}
.brand-ico{font-size:1.9rem;filter:drop-shadow(0 0 .5rem rgba(255,224,51,.7))}
.brand-txt{font-weight:900;font-size:.95rem;line-height:1.05;letter-spacing:.06em;color:var(--yellow);text-shadow:0 0 .8rem rgba(255,224,51,.4)}
.tbtn{display:flex;align-items:center;gap:.4rem;padding:.45rem .8rem;border-radius:.8rem;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:.8rem;transition:.15s}
.tbtn:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.tbtn:active{transform:scale(.95)}
.tbtn span{font-size:1.2rem}
.tbtn em{font-style:normal;letter-spacing:.04em}

.scorebox{display:flex;align-items:center;gap:.4rem;padding:.3rem .5rem;border-radius:1rem;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.score-val{display:flex;flex-direction:column;align-items:center;min-width:5.2rem;line-height:1}
.score-val small{font-size:.6rem;letter-spacing:.14em;opacity:.7;font-weight:700}
.score-val b{font-size:1.8rem;font-weight:900;color:var(--yellow);text-shadow:0 0 .8rem rgba(255,224,51,.55)}
.score-val b.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.5)}}
.sbtn{padding:.45rem .7rem;border-radius:.7rem;font-weight:800;font-size:.8rem;transition:.15s;background:rgba(255,255,255,.12)}
.sbtn.plus{background:linear-gradient(135deg,#1fbf66,#2ee27d);color:#04210f}
.sbtn.minus{background:linear-gradient(135deg,#d93556,#ff4d6a)}
.sbtn:hover{filter:brightness(1.15)}.sbtn:active{transform:scale(.92)}
.sbtn.reset{font-size:.65rem;opacity:.85}

/* ---------- Stage ---------- */
#stage{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin}
#screen{min-height:100%;padding:1.1rem 1.6rem 1.4rem}
#screen.enter{animation:enter .5s cubic-bezier(.2,.9,.3,1.1)}
@keyframes enter{from{opacity:0;transform:translateY(1.6rem) scale(.98)}to{opacity:1;transform:none}}

/* ---------- Tombol ---------- */
.btn{padding:.8rem 1.4rem;border-radius:999px;font-weight:800;font-size:.95rem;letter-spacing:.05em;
  background:linear-gradient(135deg,#5a2bd6,#8a4bff);box-shadow:0 .3rem 0 rgba(0,0,0,.35),0 0 1rem rgba(138,75,255,.35);
  transition:transform .12s,filter .15s,box-shadow .12s}
.btn:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(2px) scale(.97);box-shadow:0 .1rem 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.32;cursor:not-allowed;filter:grayscale(.7);box-shadow:none}
.btn.primary{background:linear-gradient(135deg,#ffb800,var(--yellow));color:#2b1a00;box-shadow:0 .3rem 0 #a97300,0 0 1.2rem rgba(255,224,51,.5)}
.btn.primary.pulse:not(:disabled){animation:pulse 1.4s ease-in-out infinite}
.btn.ghost{background:var(--glass);border:1px solid var(--line);box-shadow:none}
.btn.cyan{background:linear-gradient(135deg,#0aa9c9,var(--cyan));color:#012a33}
.btn.warn.armed{background:linear-gradient(135deg,#d93556,#ff4d6a);animation:pulse 1s infinite}
.btn.mega{font-size:1.6rem;padding:1.1rem 3rem;background:linear-gradient(135deg,#ffb800,var(--yellow));color:#2b1a00;box-shadow:0 .45rem 0 #a97300,0 0 2.4rem rgba(255,224,51,.6);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 .3rem 0 #a97300,0 0 2.2rem rgba(255,224,51,.9)}}

/* ---------- Bar kontrol moderator ---------- */
#controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.6rem 1.4rem;padding:.7rem 1.1rem;
  background:linear-gradient(0deg,rgba(5,8,30,.95),rgba(5,8,30,.7));border-top:1px solid var(--line);backdrop-filter:blur(8px)}
#controls[hidden]{display:none}
.cgroup{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.cgroup.flow{flex:1;justify-content:center}
.cgroup .btn{font-size:.85rem;padding:.7rem 1.1rem}
.cgroup.flow .btn{font-size:1rem;padding:.8rem 1.5rem}
.clabel{font-size:.6rem;letter-spacing:.16em;opacity:.55;font-weight:700}

/* ---------- Landing ---------- */
.landing{max-width:92rem;margin:0 auto;display:flex;flex-direction:column;gap:1.1rem}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:1.5rem;align-items:center}
.ribbon{display:inline-block;padding:.35rem 1.1rem;border-radius:.4rem;background:linear-gradient(90deg,#ff3d8a,#8a4bff);font-weight:800;font-size:.9rem;letter-spacing:.12em;transform:skew(-8deg);box-shadow:0 .25rem 0 rgba(0,0,0,.35);margin-bottom:.9rem}
.hero-title{display:flex;flex-direction:column;line-height:1;gap:.2rem}
.hero-title span{font-size:2rem;font-weight:800;letter-spacing:.18em;color:var(--cyan);text-shadow:0 0 1rem rgba(39,225,255,.6)}
.hero-title b{font-size:4.2rem;font-weight:900;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 10%,var(--yellow) 60%,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .3rem 0 rgba(0,0,0,.45)) drop-shadow(0 0 1.4rem rgba(255,224,51,.35))}
.hero-sub{font-size:1.25rem;margin:.9rem 0 1.2rem;max-width:40rem;opacity:.95;line-height:1.5}
.hero-host{position:relative;display:flex;flex-direction:column;align-items:center}
.hero-host .mascot-wrap{width:min(15rem,100%)}
.bubble{position:relative;padding:.9rem 1.1rem;border-radius:1.2rem;background:#fff;color:#14205a;font-weight:700;font-size:.95rem;line-height:1.4;box-shadow:0 .4rem 0 rgba(0,0,0,.3);margin-bottom:.9rem;animation:popIn .6s}
.bubble::after{content:'';position:absolute;left:50%;bottom:-.7rem;margin-left:-.7rem;border:.7rem solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

.mini-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
.mini{--c1:#8a4bff;--c2:#27e1ff;text-align:left;padding:.9rem 1rem;border-radius:1.1rem;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--line);border-top:.3rem solid var(--c1);transition:.2s}
.mini:hover{transform:translateY(-.3rem);box-shadow:0 .8rem 1.6rem rgba(0,0,0,.35),0 0 1.2rem var(--c1)}
.mini .mi{font-size:1.8rem}
.mini h4{font-size:.95rem;font-weight:900;letter-spacing:.04em;margin:.2rem 0;color:var(--c2)}
.mini p{font-size:.78rem;opacity:.85;line-height:1.4}
.lower{display:grid;grid-template-columns:1.6fr 1fr;gap:.9rem}
.howto,.board{padding:1rem 1.2rem;border-radius:1.1rem;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px)}
.howto h3,.board h3{font-size:.8rem;letter-spacing:.16em;color:var(--yellow);margin-bottom:.6rem}
.howto ol{display:grid;grid-template-columns:1fr 1fr;gap:.45rem 1.2rem;list-style:none;counter-reset:s}
.howto li{counter-increment:s;font-size:.85rem;line-height:1.4;display:flex;gap:.6rem}
.howto li::before{content:counter(s);flex:none;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--violet);display:grid;place-items:center;font-weight:900;font-size:.8rem}
.board .big{font-size:2.6rem;font-weight:900;color:var(--yellow);line-height:1;text-shadow:0 0 1rem rgba(255,224,51,.5)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.chip{padding:.25rem .6rem;border-radius:999px;font-size:.7rem;font-weight:700;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.chip.done{background:rgba(46,226,125,.22);border-color:var(--green);color:#b9ffd6}

/* ---------- Menu ---------- */
.menu{max-width:96rem;margin:0 auto;text-align:center}
.menu-title{font-size:2.6rem;font-weight:900;letter-spacing:.08em;color:var(--yellow);text-shadow:0 .2rem 0 rgba(0,0,0,.4),0 0 1.4rem rgba(255,224,51,.4)}
.menu-sub{opacity:.85;margin:.2rem 0 1.2rem;font-size:1.05rem}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem}
.gcard{--c1:#8a4bff;--c2:#27e1ff;position:relative;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:1.4rem 1.1rem 1.2rem;border-radius:1.5rem;text-align:center;
  background:linear-gradient(170deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:2px solid color-mix(in srgb,var(--c1) 60%,transparent);
  box-shadow:0 .6rem 1.6rem rgba(0,0,0,.4);transition:transform .2s,box-shadow .2s;cursor:pointer;overflow:hidden}
.gcard::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0,var(--c1),transparent 65%);opacity:.3;pointer-events:none}
.gcard:hover{transform:translateY(-.5rem) scale(1.02);box-shadow:0 1.2rem 2.4rem rgba(0,0,0,.5),0 0 2rem var(--c1)}
.gcard:active{transform:scale(.97)}
.gnum{font-size:.75rem;letter-spacing:.2em;font-weight:800;color:var(--c2)}
.gico{font-size:4.2rem;line-height:1;filter:drop-shadow(0 .3rem .4rem rgba(0,0,0,.4));transition:transform .3s}
.gcard:hover .gico{transform:scale(1.2) rotate(-6deg)}
.gcard h3{font-size:1.3rem;font-weight:900;line-height:1.1;letter-spacing:.03em}
.gcard p{font-size:.9rem;line-height:1.5;opacity:.92;flex:1}
.gmeta{font-size:.7rem;letter-spacing:.1em;font-weight:700;opacity:.75}
.gbtn{margin-top:.3rem;width:100%;background:linear-gradient(135deg,var(--c1),var(--c2));color:#0b0b1e;box-shadow:0 .3rem 0 rgba(0,0,0,.4)}
.gdone{position:absolute;top:.7rem;right:.7rem;padding:.2rem .6rem;border-radius:999px;background:var(--green);color:#04210f;font-size:.65rem;font-weight:900}

/* ---------- Game layout ---------- */
.game{--c1:#8a4bff;--c2:#27e1ff;max-width:104rem;margin:0 auto;display:grid;grid-template-columns:1fr 13rem;gap:1.3rem;align-items:start}
.gbar{grid-column:1/-1;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.gtitle{padding:.45rem 1.1rem;border-radius:.9rem;font-weight:900;letter-spacing:.06em;font-size:1.15rem;background:linear-gradient(135deg,var(--c1),var(--c2));color:#0b0b1e;box-shadow:0 .25rem 0 rgba(0,0,0,.35)}
.gprog{font-weight:800;letter-spacing:.1em;font-size:.9rem;opacity:.9;flex:1}
.gmain{position:relative;min-width:0}
.host{position:sticky;top:.5rem;display:flex;flex-direction:column;align-items:center}
.host .bubble{font-size:.85rem;padding:.7rem .9rem;margin-bottom:.8rem}
.mascot-wrap{width:100%}
.mascot{width:100%;height:auto;display:block;overflow:visible}
.m-body{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
.m-excited .m-body,.m-party .m-body{animation:hop .55s ease-in-out infinite}
.m-shock .m-body{animation:shiver .14s linear infinite}
.m-confused .m-body{animation:tilt 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.4rem)}}
@keyframes hop{50%{transform:translateY(-.9rem) rotate(2deg)}}
@keyframes shiver{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes tilt{50%{transform:rotate(4deg)}0%,100%{transform:rotate(-3deg)}}

/* Timer */
.timer{position:relative;width:4.6rem;height:4.6rem;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:rgba(0,0,0,.35);stroke-width:8}
.timer .trk{stroke:rgba(255,255,255,.15)}
.timer .prg{fill:none;stroke:var(--cyan);stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .3s;stroke-dasharray:283}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.9rem;font-weight:900}
.timer.idle{opacity:.55}
.timer.paused .prg{stroke:#999}
.timer.danger .prg{stroke:var(--red)}
.timer.danger b{color:var(--red);animation:tickpop 1s infinite}
@keyframes tickpop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.timesup{display:none;position:absolute;left:50%;top:-4.6rem;transform:translateX(-50%) rotate(-3deg);z-index:6;padding:.6rem 2rem;border-radius:1rem;background:var(--red);font-size:1.9rem;font-weight:900;letter-spacing:.08em;box-shadow:0 .4rem 0 #8e1530,0 0 2rem rgba(255,77,106,.8)}
.timesup.show{display:block;animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{opacity:0;transform:translateX(-50%) rotate(-3deg) scale(3)}to{opacity:1;transform:translateX(-50%) rotate(-3deg) scale(1)}}

/* Kartu umum */
.card{padding:1.2rem 1.5rem;border-radius:1.4rem;background:linear-gradient(170deg,rgba(255,255,255,.13),rgba(255,255,255,.05));border:1px solid var(--line);backdrop-filter:blur(8px);box-shadow:0 .6rem 1.6rem rgba(0,0,0,.35)}
.qlabel{font-size:.8rem;font-weight:800;letter-spacing:.18em;color:var(--c2);margin-bottom:.4rem}
.qtext{font-size:2rem;font-weight:800;line-height:1.3}

/* Berkas kasus */
.casefile{position:relative;padding:1.6rem 1.8rem 1.4rem;border-radius:.6rem 1.4rem 1.4rem 1.4rem;background:linear-gradient(160deg,#fff7d6,#ffe9a0);color:#2a1d05;box-shadow:0 .7rem 0 rgba(0,0,0,.3),0 1rem 2rem rgba(0,0,0,.4);margin-top:1.4rem}
.cf-tab{position:absolute;top:-1.5rem;left:0;padding:.35rem 1.2rem;border-radius:.7rem .7rem 0 0;background:#ffcf33;font-weight:900;font-size:.85rem;letter-spacing:.1em}
.casefile h2{font-size:1.9rem;font-weight:900;line-height:1.15;margin-bottom:.8rem;color:#7a1630}
.casefile p{font-size:1.35rem;line-height:1.55;margin-bottom:.7rem;font-weight:500}
.cf-stamp{position:absolute;right:1.2rem;top:1rem;border:.2rem solid #b3122e;color:#b3122e;padding:.15rem .7rem;font-weight:900;letter-spacing:.14em;font-size:.9rem;transform:rotate(6deg);opacity:.8}
.cf-note{margin-top:.8rem;padding-top:.7rem;border-top:2px dashed rgba(0,0,0,.25);font-weight:700;font-size:.95rem}
.steps{display:flex;gap:.5rem;align-items:center;margin:.3rem 0 .9rem;flex-wrap:wrap}
.step{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;font-weight:900;background:rgba(255,255,255,.12);border:2px solid var(--line)}
.step.now{background:var(--yellow);color:#2b1a00;border-color:#fff;transform:scale(1.15);box-shadow:0 0 1rem rgba(255,224,51,.7)}
.step.done{background:var(--green);color:#04210f}
.steptxt{font-weight:800;letter-spacing:.06em;font-size:.9rem}
.recap{margin:0 0 .8rem;padding:.5rem 1rem;border-radius:.9rem;background:rgba(255,224,51,.1);border:1px solid rgba(255,224,51,.35)}
.recap summary{cursor:pointer;font-weight:800;font-size:.85rem;color:var(--yellow)}
.recap p{font-size:1rem;line-height:1.5;margin-top:.5rem;opacity:.95}

/* Opsi jawaban */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.1rem}
.opt{position:relative;display:flex;gap:.8rem;align-items:flex-start;padding:1.1rem 1.2rem;border-radius:1.2rem;background:rgba(255,255,255,.09);border:2px solid var(--line);animation:optin .45s both;transition:.3s}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}
@keyframes optin{from{opacity:0;transform:translateY(1rem)}to{opacity:1;transform:none}}
.ol{flex:none;width:2.6rem;height:2.6rem;border-radius:.8rem;display:grid;place-items:center;font-weight:900;font-size:1.4rem;background:linear-gradient(135deg,var(--c1),var(--c2));color:#0b0b1e}
.ot{flex:1;min-width:0}
.ot p{font-size:1.45rem;font-weight:700;line-height:1.35}
.ot .why{margin-top:.6rem;padding-top:.5rem;border-top:1px solid rgba(255,255,255,.25);font-size:1rem;line-height:1.45;font-weight:500;opacity:.95}
.opt.correct{background:linear-gradient(160deg,rgba(46,226,125,.4),rgba(46,226,125,.18));border-color:var(--green);box-shadow:0 0 2rem rgba(46,226,125,.6);animation:correctpop .7s both;z-index:2}
.opt.correct .ol{background:var(--green);color:#04210f}
.opt.wrong{opacity:.62;border-color:rgba(255,77,106,.5)}
.opt.wrong .ol{background:var(--red);color:#fff}
.opt .mark{position:absolute;top:-.8rem;right:-.5rem;font-size:1.8rem;display:none}
.opt.correct .mark,.opt.wrong .mark{display:block}
@keyframes correctpop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1.02)}}

/* Reveal */
.reveal-row{margin-top:1.1rem;display:grid;gap:.8rem;animation:optin .5s both}
.reaction{font-size:2.3rem;font-weight:900;letter-spacing:.04em;text-align:center;color:var(--yellow);text-shadow:0 .2rem 0 rgba(0,0,0,.45),0 0 1.4rem rgba(255,224,51,.5);animation:stamp2 .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp2{from{opacity:0;transform:scale(2.4) rotate(-4deg)}to{opacity:1;transform:none}}
.explain{padding:1rem 1.4rem;border-radius:1.2rem;background:rgba(39,225,255,.12);border:1px solid rgba(39,225,255,.5)}
.explain b{font-size:.8rem;letter-spacing:.18em;color:var(--cyan)}
.explain p{font-size:1.25rem;line-height:1.5;margin-top:.3rem}
.flash{position:fixed;inset:0;pointer-events:none;z-index:50;animation:flash 1s forwards}
.flash.green{background:radial-gradient(circle,rgba(46,226,125,.55),transparent 70%)}
.flash.red{background:radial-gradient(circle,rgba(255,77,106,.6),transparent 70%)}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

/* Ringkasan kasus */
.summary h2{font-size:2.1rem;font-weight:900;color:var(--yellow);margin-bottom:.3rem}
.summary ol{list-style:none;display:grid;gap:.8rem;margin-top:1rem}
.summary li{padding:.9rem 1.1rem;border-radius:1rem;background:rgba(255,255,255,.08);border-left:.4rem solid var(--green)}
.summary li small{display:block;font-size:.75rem;letter-spacing:.14em;color:var(--cyan);font-weight:800}
.summary li strong{display:block;font-size:1.1rem;margin:.2rem 0;font-weight:700;opacity:.9}
.summary li span{font-size:1.25rem;font-weight:800;color:#b9ffd6}

/* Misteri */
.mystery-grid{display:grid;grid-template-columns:15rem 1fr;gap:1.4rem;align-items:center}
.suspect{position:relative;width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 50% 30%,#3b2a86,#0b0f3d 70%);border:.3rem solid var(--c1);box-shadow:0 0 2.4rem var(--c1),inset 0 0 2rem rgba(0,0,0,.6)}
.suspect .q{font-size:7rem;font-weight:900;color:var(--c2);text-shadow:0 0 1.6rem var(--c2);animation:bob 2s infinite}
.suspect .face{font-size:6rem;animation:correctpop .8s both}
.suspect .nm{position:absolute;bottom:-1.1rem;left:50%;transform:translateX(-50%);white-space:nowrap;padding:.3rem 1rem;border-radius:.8rem;background:var(--green);color:#04210f;font-weight:900;font-size:1rem}
.mnum{font-size:1rem;font-weight:900;letter-spacing:.2em;color:var(--yellow)}
.diff{display:inline-block;margin-left:.6rem;padding:.15rem .7rem;border-radius:999px;font-size:.75rem;font-weight:900;letter-spacing:.1em;color:#04210f}
.diff-mudah{background:var(--green)}.diff-sedang{background:var(--yellow)}.diff-sulit{background:var(--red);color:#fff}
.clues{display:grid;gap:.6rem;margin:.7rem 0}
.clue{padding:.8rem 1.1rem;border-radius:1rem;font-size:1.4rem;font-weight:700;line-height:1.35;background:rgba(255,255,255,.12);border-left:.4rem solid var(--yellow);animation:optin .5s both}
.clue small{display:block;font-size:.7rem;letter-spacing:.16em;color:var(--yellow);font-weight:800}
.clue.locked{background:rgba(255,255,255,.04);border-left-color:rgba(255,255,255,.2);border-style:dashed;opacity:.55;font-size:1rem;animation:none}
.whoami{font-size:2rem;font-weight:900;color:var(--cyan)}

/* Emoji */
.emoji-stage{text-align:center;padding:1.4rem 1rem}
.emoji-row{display:flex;justify-content:center;align-items:center;gap:1rem;flex-wrap:wrap;margin:.6rem 0 1rem}
.emoji-row .em{font-size:7.5rem;line-height:1.1;animation:emfloat 2.6s ease-in-out infinite;filter:drop-shadow(0 .5rem .6rem rgba(0,0,0,.5))}
.emoji-row .em:nth-of-type(2){animation-delay:.3s}.emoji-row .em:nth-of-type(3){animation-delay:.6s}.emoji-row .em:nth-of-type(4){animation-delay:.9s}
.emoji-row .plus{font-size:3rem;font-weight:900;color:var(--yellow)}
@keyframes emfloat{50%{transform:translateY(-.8rem) scale(1.06)}}
.ready-hint{font-size:1.2rem;font-weight:700;opacity:.9}

/* Mitos / Fakta */
.statement{text-align:center;padding:2rem 2rem}
.statement .qtext{font-size:2.3rem}
.catchip{display:inline-block;padding:.25rem .9rem;border-radius:999px;background:rgba(255,255,255,.14);font-size:.8rem;font-weight:800;letter-spacing:.14em;margin-bottom:.8rem}
.mf{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:1.1rem}
.mfb{position:relative;padding:1.6rem 1rem;border-radius:1.6rem;font-size:3.2rem;font-weight:900;letter-spacing:.08em;text-align:center;border:3px solid rgba(255,255,255,.4);animation:optin .45s both;transition:.3s}
.mfb small{display:block;font-size:.9rem;letter-spacing:.1em;font-weight:700;opacity:.9}
.mfb.mitos{background:linear-gradient(160deg,#a8142f,#ff4d6a)}
.mfb.fakta{background:linear-gradient(160deg,#118a4a,#2ee27d);color:#04210f}
.mfb.win{transform:scale(1.04);box-shadow:0 0 3rem currentColor;border-color:#fff;animation:correctpop .7s both}
.mfb.mitos.win{box-shadow:0 0 3rem #ff4d6a}.mfb.fakta.win{box-shadow:0 0 3rem #2ee27d}
.mfb.lose{opacity:.28;filter:grayscale(.8)}
.bigstamp{text-align:center;font-size:3.4rem;font-weight:900;letter-spacing:.06em;margin:.8rem 0 0;animation:stamp2 .6s cubic-bezier(.2,1.6,.4,1)}
.bigstamp.mitos{color:var(--red);text-shadow:0 .25rem 0 rgba(0,0,0,.5),0 0 2rem rgba(255,77,106,.8)}
.bigstamp.fakta{color:var(--green);text-shadow:0 .25rem 0 rgba(0,0,0,.5),0 0 2rem rgba(46,226,125,.8)}

/* Layar selesai */
.finish{max-width:70rem;margin:1rem auto;text-align:center}
.finish h2{font-size:2.8rem;font-weight:900;line-height:1.1;color:var(--yellow);text-shadow:0 .25rem 0 rgba(0,0,0,.45),0 0 1.6rem rgba(255,224,51,.5)}
.finish .fm{width:11rem;margin:0 auto}
.finish p.lead{font-size:1.3rem;margin:.8rem 0 1.2rem;opacity:.95}
.stats{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.4rem}
.stat{min-width:12rem;padding:1rem 1.4rem;border-radius:1.2rem;background:var(--glass);border:1px solid var(--line)}
.stat small{display:block;font-size:.7rem;letter-spacing:.16em;font-weight:800;opacity:.75}
.stat b{font-size:2.6rem;font-weight:900;color:var(--cyan)}
.finish .btns{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap}
.finish .btns .btn{font-size:1.1rem;padding:.9rem 1.8rem}
.finale h2{font-size:3.2rem}
.finale .quote{font-size:1.6rem;font-style:italic;margin:.6rem 0 1.4rem;color:var(--cyan);font-weight:700}

/* Modal */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(3,5,20,.78);backdrop-filter:blur(5px)}
.modal[hidden]{display:none}
.modal-card{width:min(36rem,92vw);padding:1.6rem;border-radius:1.4rem;background:linear-gradient(160deg,#1a1f6b,#2b0f63);border:1px solid var(--line);box-shadow:0 2rem 4rem rgba(0,0,0,.6);animation:popIn .3s}
.modal-card h2{color:var(--yellow);margin-bottom:.3rem}
.modal-card p{opacity:.85;font-size:.9rem;margin-bottom:1rem}
.mgrid{display:grid;gap:.7rem}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem .9rem;border-radius:.9rem;background:rgba(255,255,255,.08)}
.mrow label{font-weight:800;font-size:.9rem;letter-spacing:.04em}
.mrow input{width:6rem;padding:.4rem .6rem;border-radius:.6rem;border:2px solid var(--line);background:rgba(0,0,0,.4);color:#fff;font-size:1.1rem;font-weight:800;text-align:center;font-family:inherit}
.mbtns{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.2rem;flex-wrap:wrap}

#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:90}
#toast{position:fixed;left:50%;bottom:6rem;transform:translate(-50%,2rem);padding:.7rem 1.4rem;border-radius:999px;background:#fff;color:#14205a;font-weight:800;font-size:1rem;box-shadow:0 .5rem 1.4rem rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s;z-index:120;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Responsif ---------- */
@media (max-width:1100px){
  .tbtn em{display:none}
  .hero{grid-template-columns:1fr}
  .hero-title b{font-size:3rem}
  .cards{grid-template-columns:repeat(2,1fr)}
  .mini-cards{grid-template-columns:repeat(2,1fr)}
  .lower{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .mystery-grid{grid-template-columns:1fr}
  .suspect{width:11rem;margin:0 auto 1rem}
}
@media (max-width:820px){
  .game{grid-template-columns:1fr}
  .host{display:none}
  .howto ol{grid-template-columns:1fr}
  .cards,.mini-cards{grid-template-columns:1fr}
  .emoji-row .em{font-size:4.6rem}
  .qtext{font-size:1.5rem}
  .mf{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  #bgfx::before,#bgfx span{animation:none}
}

</style>

/* ---------- GAME 1: WHO TAKES THE RISK? ----------
   Setiap kasus WAJIB punya tepat 3 pertanyaan berkaitan. */
const CASES = [
  {

    scenario: [
      'PT Nusantara Mesin, sebuah perusahaan Indonesia, mengimpor mesin industri dari perusahaan Jepang.',

      'Setelah mesin tiba di Indonesia, PT Nusantara Mesin menemukan bahwa sebagian komponen mesin mengalami kerusakan. Importir pun mempertanyakan: apakah bank harus bertanggung jawab atas kerusakan tersebut?'

/* ---------- Validasi data ---------- */
function assertData() {
  const errs = [];
  CASES.forEach((c) => {
    if (c.questions.length !== 3) errs.push(`Kasus ${c.id} harus punya 3 pertanyaan`);
    c.questions.forEach((q, i) => {
      if (q.options.length !== 3) errs.push(`Kasus ${c.id} P${i + 1}: harus 3 opsi`);
      if (!(q.correct >= 0 && q.correct < q.options.length)) errs.push(`Kasus ${c.id} P${i + 1}: indeks jawaban salah`);
      q.options.forEach((o, k) => { if (!o.why) errs.push(`Kasus ${c.id} P${i + 1} opsi ${k + 1}: penjelasan kosong`); });
      if (!q.explanation) errs.push(`Kasus ${c.id} P${i + 1}: penjelasan kosong`);
    });
  });
  const need = { mudah: 3, sedang: 2, sulit: 1 };
  MYSTERIES.forEach((m, i) => {
    if (m.clues.length !== need[m.difficulty]) errs.push(`Misteri ${i + 1}: jumlah petunjuk tidak sesuai tingkat`);
    if (m.options.length !== 3 || m.options[m.correct] !== m.name) errs.push(`Misteri ${i + 1}: jawaban tidak cocok`);
  });
  EMOJIS.forEach((e, i) => { if (e.options.length !== 3 || !(e.correct >= 0 && e.correct < 3)) errs.push(`Emoji ${i + 1}: data salah`); });
  MYTHS.forEach((m, i) => { if (m.answer !== 'mitos' && m.answer !== 'fakta') errs.push(`Mitos ${i + 1}: jawaban salah`); });
  if (errs.length) console.error('Data tidak valid:', errs);
  return errs;
}

/* ---------- Penyimpanan lokal ---------- */
function loadPrefs() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    if (typeof d.score === 'number') st.score = d.score;
    if (typeof d.sound === 'boolean') st.sound = d.sound;
    if (d.durations) Object.keys(DEFAULT_TIMES).forEach((k) => { const v = +d.durations[k]; if (v >= 3 && v <= 120) st.durations[k] = v; });
  } catch (e) { /* abaikan */ }
}
function savePrefs() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ score: st.score, sound: st.sound, durations: st.durations })); } catch (e) { /* abaikan */ }
}

/* ---------- Suara (dibuat dengan WebAudio, tanpa file) ---------- */
let actx = null;
function ensureAudio() {
  if (!st.sound) return null;
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(f, d, type, v, delay, slideTo) {
  const a = ensureAudio(); if (!a) return;
  try {
    const t0 = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v || 0.15, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + d + 0.05);
  } catch (e) { /* abaikan */ }
}
const SFX = {
  tick: () => tone(880, 0.07, 'square', 0.05),
  tickFast: () => tone(1320, 0.1, 'square', 0.09),
  start: () => [392, 523, 659, 784].forEach((f, i) => tone(f, 0.18, 'triangle', 0.16, i * 0.09)),
  right: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.26, 'triangle', 0.17, i * 0.1)),
  wrong: () => { tone(220, 0.35, 'sawtooth', 0.13, 0, 110); tone(165, 0.45, 'sawtooth', 0.13, 0.22, 80); },
  buzzer: () => tone(150, 0.7, 'sawtooth', 0.17, 0, 110),
  myth: () => { tone(130, 0.5, 'sawtooth', 0.18, 0, 60); tone(98, 0.6, 'square', 0.12, 0.25, 50); },
  drum: () => [0, 0.08, 0.16].forEach((d) => tone(180, 0.08, 'triangle', 0.14, d, 120)),
  done: () => [523, 659, 784, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.17, i * 0.11)),
  click: () => tone(600, 0.05, 'sine', 0.06)
};

/* ---------- Confetti ---------- */
const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [], raf = null;
const CONF_COLORS = ['#ffe033', '#27e1ff', '#8a4bff', '#ff3d8a', '#2ee27d', '#ffffff', '#ff9f1c'];
function sizeCanvas() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
function confetti(n) {
  n = n || 140;
  for (let i = 0; i < n; i++) {
    parts.push({
      x: window.innerWidth / 2 + (Math.random() - .5) * window.innerWidth * .5, y: window.innerHeight * .35,
      vx: (Math.random() - .5) * 18, vy: -Math.random() * 18 - 4, g: .38, w: 6 + Math.random() * 8, h: 4 + Math.random() * 6,
      c: CONF_COLORS[(Math.random() * CONF_COLORS.length) | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 0, max: 110 + Math.random() * 90
    });
  }
  if (!raf) raf = requestAnimationFrame(confettiLoop);
}
function confettiLoop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter((p) => p.life < p.max && p.y < cv.height + 40);
  parts.forEach((p) => {
    p.life++; p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.max(0, 1 - p.life / p.max);
    cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
  });
  if (parts.length) raf = requestAnimationFrame(confettiLoop);
  else { raf = null; cx.clearRect(0, 0, cv.width, cv.height); }
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ---------- Timer (satu interval saja) ---------- */
let tickHandle = null;
function stopTimer() { if (tickHandle) { clearInterval(tickHandle); tickHandle = null; } }
function startTimer(sec) {
  stopTimer();
  st.t = { left: sec, total: sec, running: true, done: false };
  tickHandle = setInterval(timerTick, 1000);
  updateTimerUI();
}
function timerTick() {
  if (!st.t || !st.t.running || st.phase !== 'live') { stopTimer(); return; }
  st.t.left--;
  if (st.t.left <= 0) {
    st.t.left = 0; st.t.running = false; st.t.done = true; stopTimer();
    SFX.buzzer(); shake(); setMood('shock', 'WAKTU HABIS! Moderator, silakan ungkap jawabannya.');
    updateTimerUI(); renderControls();
    return;
  }
  if (st.t.left <= 3) SFX.tickFast(); else SFX.tick();
  updateTimerUI();
}
function pauseResume() {
  if (st.phase !== 'live' || !st.t || st.t.done) return;
  if (st.t.running) { st.t.running = false; stopTimer(); }
  else { st.t.running = true; stopTimer(); tickHandle = setInterval(timerTick, 1000); }
  updateTimerUI(); renderControls();
}
function resetTimer() {
  if (st.phase !== 'live') return;
  startTimer(st.durations[st.gameId]);
  setMood('confused'); renderControls();
}
function updateTimerUI() {
  const num = $('#tnum'); if (!num) return;
  const box = $('#timer'), prg = $('#tprg'), up = $('#timesup');
  const dur = st.durations[st.gameId] || 10;
  const t = st.t;
  const left = t ? t.left : dur, total = t ? t.total : dur;
  num.textContent = left;
  prg.style.strokeDashoffset = String(283 * (1 - left / total));
  box.classList.toggle('danger', !!t && t.running && left <= 3 && left > 0);
  box.classList.toggle('idle', !t);
  box.classList.toggle('paused', !!t && !t.running && !t.done);
  if (up) up.classList.toggle('show', !!t && t.done && st.phase === 'live');
}

    <div class="gbar"><div class="gtitle">${g.icon} ${g.title}</div><div class="gprog">${progressText()}</div>${timerHTML()}</div>
    <div class="gmain"><div class="timesup" id="timesup">WAKTU HABIS!</div>${body}</div>
    <aside class="host" id="host"></aside>
  </section>`;
}

function screenComplete() {
  const g = gameById(st.gameId);
  const all = GAMES.every((x) => st.played[x.id]);
  const msgs = { risk: 'Kalian sudah membedah kasus ekspor-impor seperti auditor sungguhan. Bank pun lega tidak disalahkan sembarangan!',
    banker: 'Semua pelaku transaksi berhasil diungkap. Kalian layak naik jabatan jadi detektif perbankan!',
    emoji: 'Penerjemah emoji kalian resmi bersertifikat. Soal ujian pun terasa seperti stiker!',
    myth: 'Mitos-mitos perbankan sudah dibongkar. Pengetahuan kalian lolos audit!' };
  return `<section class="finish">
    <div class="fm">${mascot('party')}</div>
    <h2>SELAMAT! KAMU BERHASIL MENYELESAIKAN PERMAINAN!</h2>
    <p class="lead">${g.icon} ${g.title}. ${msgs[g.id]}</p>
    <div class="stats"><div class="stat"><small>TOTAL ${g.unit.toUpperCase()} TERJAWAB</small><b>${st.answered} / ${totalItems(g.id)}</b></div>
      <div class="stat"><small>SKOR SAAT INI</small><b>${st.score}</b></div></div>
    <div class="btns"><button class="btn primary" data-act="again">MAIN LAGI</button>
      <button class="btn cyan" data-act="toMenu">KEMBALI KE MENU UTAMA</button>
      ${all ? '<button class="btn ghost" data-act="finale">LAYAR PENUTUP ACARA 🎬</button>' : ''}</div>
  </section>`;
}

function screenFinale() {
  return `<section class="finish finale">
    <div class="fm" style="width:14rem">${mascot('party')}</div>
    <h2>SELAMAT! KALIAN TELAH BERTAHAN DI THE BANKING GAME SHOW!</h2>
    <p class="quote">“Transaksi boleh internasional, tetapi pengetahuan harus tetap lokal!”</p>
    <div class="stats"><div class="stat"><small>SKOR AKHIR KELAS</small><b>${st.score}</b></div>
      <div class="stat"><small>PERMAINAN DISELESAIKAN</small><b>${GAMES.filter((g) => st.played[g.id]).length} / 4</b></div></div>
    <div class="btns"><button class="btn primary" data-act="restartShow">MAIN DARI AWAL</button>
      <button class="btn cyan" data-act="toMenu">KEMBALI KE MENU UTAMA</button>
      <button class="btn ghost" data-act="partyTime">🎉 PESTA KONFETI!</button></div>
  </section>`;
}

/* ---------- Render ---------- */
function render(anim) {
  const sc = $('#screen');
  sc.innerHTML = { landing: screenLanding, menu: screenMenu, game: screenGame, complete: screenComplete, finale: screenFinale }[st.screen]();
  if (anim) {
    sc.classList.remove('enter'); void sc.offsetWidth; sc.classList.add('enter');
    $('#stage').scrollTop = 0;
  }
  renderHost(); renderControls(); updateTimerUI();
  $('#scoreNum').textContent = st.score;
}

function cbtn(act, label, o) {
  o = o || {};
  const cls = ['btn']; if (o.primary) cls.push('primary', 'pulse'); if (o.ghost) cls.push('ghost'); if (o.cyan) cls.push('cyan'); if (o.armed) cls.push('warn', 'armed');
  return `<button class="${cls.join(' ')}" data-act="${act}" ${o.disabled ? 'disabled' : ''}>${label}</button>`;
}

function renderControls() {
  const bar = $('#controls');
  if (st.screen !== 'game') { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  const g = st.gameId, ph = st.phase, flow = [];
  const lastItem = g === 'risk' ? (st.caseIdx === CASES.length - 1) : (st.idx === totalItems(g) - 1);
  const finishLabel = 'SELESAIKAN PERMAINAN';

  if (g === 'risk') {
    if (ph === 'case') flow.push(cbtn('begin', 'MULAI PERTANYAAN', { primary: true }));
    else if (ph === 'live') flow.push(cbtn('reveal', 'UNGKAP JAWABAN', { primary: true }), cbtn('next', 'PERTANYAAN BERIKUTNYA', { disabled: true }));
    else if (ph === 'revealed') flow.push(cbtn('reveal', 'UNGKAP JAWABAN', { disabled: true }), cbtn('next', st.qIdx < 2 ? 'PERTANYAAN BERIKUTNYA' : 'LIHAT RINGKASAN KASUS', { primary: true }));
    else if (ph === 'summary') flow.push(cbtn('next', lastItem ? finishLabel : 'KASUS BERIKUTNYA', { primary: true }));
  } else {
    const nextLabel = lastItem ? finishLabel : (g === 'banker' ? 'MISTERI BERIKUTNYA' : 'PERTANYAAN BERIKUTNYA');
    if (g === 'banker') {
      const m = MYSTERIES[st.idx], more = st.clues < m.clues.length;
      if (ph === 'ready') flow.push(cbtn('clue', 'PETUNJUK BERIKUTNYA', { primary: more, disabled: !more }), cbtn('begin', 'TAMPILKAN PILIHAN & MULAI WAKTU', { primary: !more }));
      else if (ph === 'live') flow.push(cbtn('clue', 'PETUNJUK BERIKUTNYA', { disabled: !more }), cbtn('reveal', 'UNGKAP JAWABAN', { primary: true }), cbtn('next', nextLabel, { disabled: true }));
      else flow.push(cbtn('clue', 'PETUNJUK BERIKUTNYA', { disabled: true }), cbtn('reveal', 'UNGKAP JAWABAN', { disabled: true }), cbtn('next', nextLabel, { primary: true }));
    } else {
      if (ph === 'ready') flow.push(cbtn('begin', g === 'emoji' ? 'MULAI TANTANGAN' : 'MULAI PERTANYAAN', { primary: true }));
      else if (ph === 'live') flow.push(cbtn('reveal', 'UNGKAP JAWABAN', { primary: true }), cbtn('next', nextLabel, { disabled: true }));
      else flow.push(cbtn('reveal', 'UNGKAP JAWABAN', { disabled: true }), cbtn('next', nextLabel, { primary: true }));
    }
  }

  const timerGrp = (ph === 'live' && st.t)
    ? `<div class="cgroup"><span class="clabel">WAKTU</span>${cbtn('pause', st.t.running ? '❚❚ JEDA' : '▶ LANJUTKAN', { ghost: true, disabled: st.t.done })}${cbtn('resetTime', '↺ ULANGI WAKTU', { ghost: true })}</div>` : '';
  const nav = `<div class="cgroup">${cbtn('backMenu', 'KEMBALI KE MENU', { ghost: true })}${cbtn('restart', st.armed === 'restart' ? 'YAKIN? KLIK LAGI' : 'ULANGI PERMAINAN', { ghost: st.armed !== 'restart', armed: st.armed === 'restart' })}</div>`;
  bar.innerHTML = `${nav}<div class="cgroup flow">${flow.join('')}</div>${timerGrp}`;
}

function renderTop() {
  $('#sndIco').textContent = st.sound ? '🔊' : '🔇';
  $('#sndTxt').textContent = st.sound ? 'SUARA AKTIF' : 'SUARA NONAKTIF';
  $('#scoreNum').textContent = st.score;
}

/* ---------- Alur permainan ---------- */
function leaveGame() { stopTimer(); st.t = null; st.armed = null; }

function goLanding() { leaveGame(); st.screen = 'landing'; st.gameId = null; st.mood = 'happy'; render(true); }
function goMenu() { leaveGame(); st.screen = 'menu'; st.gameId = null; render(true); }

function playGame(id) {
  leaveGame();
  st.gameId = id; st.screen = 'game';
  st.caseIdx = 0; st.qIdx = 0; st.idx = 0; st.clues = 1; st.optionsShown = false; st.answered = 0; st.reaction = '';
  st.phase = id === 'risk' ? 'case' : 'ready';
  st.mood = 'happy'; st.line = gameById(id).intro;
  SFX.start(); render(true);
}

function resetItem() { st.t = null; st.clues = 1; st.optionsShown = false; st.reaction = ''; }

function begin() {
  const g = st.gameId;
  if (st.screen !== 'game') return;
  if (g === 'risk' && st.phase === 'case') {
    st.phase = 'live'; st.qIdx = 0; st.optionsShown = true;
    startTimer(st.durations.risk); setMood('confused'); render(true);
  } else if (g !== 'risk' && st.phase === 'ready') {
    st.phase = 'live'; st.optionsShown = true;
    startTimer(st.durations[g]); setMood('confused'); render(false); SFX.drum();
  }
}

function clue() {
  if (st.gameId !== 'banker' || (st.phase !== 'ready' && st.phase !== 'live')) return;
  const m = MYSTERIES[st.idx];
  if (st.clues >= m.clues.length) return;
  st.clues++; SFX.click(); setMood('confused', 'Petunjuk baru terbuka. Siapa ya pelakunya?');
  render(false);
}

function reveal() {
  if (st.screen !== 'game' || st.phase !== 'live') return;
  stopTimer(); if (st.t) st.t.running = false;
  const g = st.gameId;
  st.phase = 'revealed'; st.answered++;
  st.reaction = pick(REACT[g].neutral);
  let mood = 'excited', good = true;
  if (g === 'myth') {
    if (MYTHS[st.idx].answer === 'mitos') { mood = 'shock'; good = false; st.reaction = pick(['JANGAN MUDAH PERCAYA!', 'WADUH, KENA TIPU MITOS!']); }
    else st.reaction = pick(['FAKTA BERHASIL DIAMANKAN!', 'PENGETAHUANMU LOLOS AUDIT!']);
  }
  render(false);
  setMood(mood);
  if (good) { SFX.right(); confetti(g === 'risk' ? 70 : 110); }
  else { SFX.myth(); shake(); }
  const sc = $('#screen'); const r = sc.querySelector('.reveal-row, .bigstamp');
  if (r && r.scrollIntoView) r.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function next() {
  if (st.screen !== 'game') return;
  const g = st.gameId;
  if (g === 'risk') {
    if (st.phase === 'revealed') {
      if (st.qIdx < 2) { st.qIdx++; st.phase = 'live'; st.reaction = ''; startTimer(st.durations.risk); setMood('confused'); render(true); }
      else { st.phase = 'summary'; st.t = null; setMood('excited', 'Kasus selesai! Tiga pertanyaan, satu cerita utuh.'); render(true); confetti(60); }
    } else if (st.phase === 'summary') {
      if (st.caseIdx < CASES.length - 1) { st.caseIdx++; st.qIdx = 0; resetItem(); st.phase = 'case'; st.mood = 'happy'; st.line = 'Kasus baru! Baca skenarionya dengan teliti.'; render(true); }
      else finishGame();
    }
    return;
  }
  if (st.phase !== 'revealed') return;
  if (st.idx < totalItems(g) - 1) { st.idx++; resetItem(); st.phase = 'ready'; st.mood = 'happy'; st.line = pick(MASCOT_LINES.happy); render(true); }
  else finishGame();
}

function finishGame() {
  stopTimer(); st.t = null;
  st.played[st.gameId] = true; st.screen = 'complete';
  render(true); SFX.done(); confetti(220);
}

function restart() {
  if (st.armed !== 'restart') { arm('restart'); return; }
  playGame(st.gameId);
  toast('Permainan diulang dari awal.');
}

function showFinale() { leaveGame(); st.screen = 'finale'; render(true); SFX.done(); confetti(260); setTimeout(() => { if (st.screen === 'finale') confetti(160); }, 900); }

/* ---------- Pengaturan waktu ---------- */
let resumeAfterModal = false;
function openTime() {
  const g = $('#mGrid');
  g.innerHTML = GAMES.map((x) => `<div class="mrow"><label for="t-${x.id}">${x.icon} ${x.title}</label><input id="t-${x.id}" type="number" min="3" max="120" value="${st.durations[x.id]}"></div>`).join('');
  resumeAfterModal = !!(st.t && st.t.running && st.phase === 'live');
  if (resumeAfterModal) pauseResume();
  $('#modal').hidden = false;
  const first = g.querySelector('input'); if (first) first.focus();
}
function closeTime() {
  $('#modal').hidden = true;
  if (resumeAfterModal && st.t && !st.t.running && !st.t.done && st.phase === 'live') pauseResume();
  resumeAfterModal = false;
}
function saveTime() {
  let bad = false;
  GAMES.forEach((x) => { const v = Math.round(+$('#t-' + x.id).value); if (v >= 3 && v <= 120) st.durations[x.id] = v; else bad = true; });
  if (bad) { toast('Waktu harus antara 3 dan 120 detik. Nilai yang salah diabaikan.'); }
  savePrefs(); closeTime(); updateTimerUI(); toast('Pengaturan waktu disimpan.');
}
function timeDefault() { GAMES.forEach((x) => { $('#t-' + x.id).value = DEFAULT_TIMES[x.id]; }); }

/* ---------- Suara & layar penuh ---------- */
function toggleSound() {
  st.sound = !st.sound; savePrefs(); renderTop();
  if (st.sound) { ensureAudio(); SFX.click(); toast('Suara diaktifkan.'); } else toast('Suara dinonaktifkan.');
}
function toggleFs() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => toast('Browser menolak layar penuh. Coba tekan F11.'));
    else toast('Layar penuh tidak didukung. Coba tekan F11.');
  } catch (e) { toast('Layar penuh tidak tersedia. Coba tekan F11.'); }
}
document.addEventListener('fullscreenchange', () => { $('#fsTxt').textContent = document.fullscreenElement ? 'KELUAR LAYAR PENUH' : 'LAYAR PENUH'; sizeCanvas(); });

/* ---------- Pengendali klik ---------- */
const ACTIONS = {
  toLanding: goLanding, toMenu: goMenu, backMenu: goMenu,
  play: (d) => playGame(d.id), again: () => playGame(st.gameId),
  begin, clue, reveal, next, restart,
  pause: pauseResume, resetTime: resetTimer,
  scoreUp, scoreDown, scoreReset,
  openTime, closeTime, saveTime, timeDefault,
  toggleSound, toggleFs,
  finale: showFinale,
  restartShow: () => { st.played = {}; goMenu(); },
  partyTime: () => { confetti(220); SFX.right(); }
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  ensureAudio();
  const fn = ACTIONS[b.dataset.act];
  if (fn) fn(b.dataset);
});

/* ---------- Pintasan keyboard (hanya saat fokus tidak di tombol/input) ---------- */
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.key === 'Escape' && !$('#modal').hidden) { closeTime(); return; }
  if (tag === 'input' || tag === 'button' || tag === 'select' || tag === 'summary') return;
  if (!$('#modal').hidden) return;
  const k = e.key.toLowerCase();
  if (k === 'f') toggleFs();
  else if (k === 'm') toggleSound();
  else if (k === ' ' || k === 'enter' || k === 'arrowright') {
    if (st.screen !== 'game') return;
    e.preventDefault(); ensureAudio();
    const ph = st.phase;
    if (ph === 'case' || ph === 'ready') begin();
    else if (ph === 'live') reveal();
    else next();
  }
});

/* ---------- Dekorasi latar ---------- */
function buildBg() {
  const icons = ['🏦', '💱', '📄', '🚢', '💵', '🌍', '📈', '🔒', '💳', '📦', '✈️', '🪙'];
  const host = $('#bgfx');
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.textContent = icons[i % icons.length];
    s.style.left = (Math.random() * 96) + '%';
    s.style.fontSize = (1.6 + Math.random() * 2.2) + 'rem';
    s.style.animationDuration = (22 + Math.random() * 26) + 's';
    s.style.animationDelay = (-Math.random() * 40) + 's';
    host.appendChild(s);
  }
}

/* ---------- Mulai ---------- */
window.addEventListener('resize', sizeCanvas);
assertData();
loadPrefs();
sizeCanvas();
buildBg();
renderTop();
render(true);
window.__BGS = { st, assertData, CASES, MYSTERIES, EMOJIS, MYTHS };

</script>
</body>
</html>
